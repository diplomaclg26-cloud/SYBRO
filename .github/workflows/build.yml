name: SYBRO Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract SYBRO source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o SYBRO_new.zip -d extracted

      - name: Regenerate Android from current Flutter template
        working-directory: extracted/SYBRO
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sybro --project-name sybro .

          # Keep SYBRO's application id as com.sybro.app.
          sed -i 's/applicationId = "com.sybro.sybro"/applicationId = "com.sybro.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = "com.sybro.sybro"/namespace = "com.sybro.app"/' android/app/build.gradle.kts

          # Move the generated MainActivity into the final package and update its package line.
          mkdir -p android/app/src/main/kotlin/com/sybro/app
          if [ -f android/app/src/main/kotlin/com/sybro/sybro/MainActivity.kt ]; then
            mv android/app/src/main/kotlin/com/sybro/sybro/MainActivity.kt android/app/src/main/kotlin/com/sybro/app/MainActivity.kt
          fi
          rm -rf android/app/src/main/kotlin/com/sybro/sybro
          sed -i 's/package com.sybro.sybro/package com.sybro.app/' android/app/src/main/kotlin/com/sybro/app/MainActivity.kt

      - name: Get packages
        working-directory: extracted/SYBRO
        run: flutter pub get

      - name: Build SYBRO APK
        working-directory: extracted/SYBRO
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SYBRO-APK
          path: extracted/SYBRO/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
